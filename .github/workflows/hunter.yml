name: meme-pump-hunter
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hunter
  cancel-in-progress: true

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hunt
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOPLUS_API_KEY: ${{ secrets.GOPLUS_API_KEY }}
        run: python hunter.py
      - name: Persist state
        run: |
          git config user.name "hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/
          git diff --cached --quiet || (git commit -m "state update [skip ci]" && git push)
