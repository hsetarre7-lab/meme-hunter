name: meme-pump-hunter-v3

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hunter-v3
  cancel-in-progress: true

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hunt
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOPLUS_API_KEY: ${{ secrets.GOPLUS_API_KEY }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          NETWORKS: solana
          PRIMARY_NETWORK: solana
          GMGN_ENRICH_LIMIT: 10
          GMGN_WALLET_LIMIT: 2
          RUGCHECK_LIMIT: 15
        run: python hunter.py

      - name: Persist state
        run: |
          git config user.name "hunter-bot"
          git config user.email "actions@users.noreply.github.com"

          git add state/

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "hunter state update [skip ci]"
            git push
          fi
